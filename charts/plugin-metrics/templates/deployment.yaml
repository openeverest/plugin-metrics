apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "plugin-metrics.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "plugin-metrics.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "plugin-metrics.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "plugin-metrics.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "plugin-metrics.fullname" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: {{ .Values.service.port }}
              protocol: TCP
          env:
            - name: PORT
              value: {{ .Values.service.port | quote }}
            - name: PROMETHEUS_URL
              value: {{ .Values.prometheus.url | quote }}
            {{- if include "plugin-metrics.dashboardsConfigMap" . }}
            - name: DASHBOARDS_FILE
              value: /etc/plugin-metrics/dashboards/dashboards.yaml
            {{- end }}
            {{- if .Values.everestAPIURL }}
            - name: EVEREST_API_URL
              value: {{ .Values.everestAPIURL | quote }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.service.port }}
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.service.port }}
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- if include "plugin-metrics.dashboardsConfigMap" . }}
          # No subPath: only a directory mount receives ConfigMap updates.
          volumeMounts:
            - name: dashboards
              mountPath: /etc/plugin-metrics/dashboards
              readOnly: true
      volumes:
        - name: dashboards
          configMap:
            name: {{ include "plugin-metrics.dashboardsConfigMap" . }}
            optional: true
          {{- end }}
